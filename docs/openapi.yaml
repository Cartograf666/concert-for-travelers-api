openapi: 3.0.3
info:
  title: Concerts for Travelers API
  version: 1.1.0
  description: |
    This is a static-file JSON API hosted on GitHub Pages.
    All endpoints represent static JSON files published under the base URL:
    `https://cartograf666.github.io/concert-for-travelers-api/`.
    There is no dynamic query support or request payload handling; consumers download these pre-generated static files.
servers:
  - url: https://cartograf666.github.io/concert-for-travelers-api
    description: Production Static Hosting (GitHub Pages)
paths:
  /index.json:
    get:
      summary: Retrieve API Index and Metadata
      description: >-
        Returns API statistics, schema version, and lists of all artist and
        city names currently represented in concerts.json. Note: these are
        raw display names (e.g. "A$AP Rocky", "Detroit"), NOT slugs -- to
        fetch a specific artist's or city's file, run the name through the
        same slugify() logic the publisher uses (lowercase, strip diacritics,
        hyphenate) before requesting /artists/{slug}.json or
        /cities/{slug}.json.
      responses:
        '200':
          description: API index data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishIndex'
  /concerts.json:
    get:
      summary: Retrieve All Concerts
      description: Returns the full list of all active/future concerts sorted by date.
      responses:
        '200':
          description: List of concerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Concert'
  /concerts/page-{n}.json:
    get:
      summary: Retrieve Paginated Concerts
      description: Returns a paginated chunk of the active/future concerts list. Stable page size is 500.
      parameters:
        - name: n
          in: path
          required: true
          description: Page number (1-indexed)
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: A page slice of concerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Concert'
  /artists.json:
    get:
      summary: Retrieve Artist Catalog
      description: Returns the full catalog of all whitelisted artists, including metadata (website, socials, genres, popularity) when known.
      responses:
        '200':
          description: Full artist catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArtistCatalogEntry'
  /status.json:
    get:
      summary: Retrieve Scraper Health Status
      description: Returns run stats, scraper pass/fail counts, and diagnostic information from the last daily scrape execution.
      responses:
        '200':
          description: Scraper run status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /changes.json:
    get:
      summary: Retrieve Changelog
      description: Returns the history of newly detected concerts within a 30-day retention window.
      responses:
        '200':
          description: Changelog entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChangeEntry'
  /artists/{slug}.json:
    get:
      summary: Retrieve Concerts by Artist
      description: |
        Returns the list of concerts for a specific artist, matching the artist's URL-friendly slug.

        **Note (Static Hosting Limitation)**: Because this API is statically hosted on GitHub Pages, requests for non-existent artist slugs cannot return a JSON 404 response and instead fall through to standard HTML 404 pages. `index.json`'s `artists` array holds raw display names (e.g. `"A$AP Rocky"`), not slugs -- run each name through the same `slugify()` logic the publisher uses (lowercase, strip diacritics, hyphenate) to build the set of valid slugs, then check the requested slug against *that* set before making this query. Comparing the raw slug directly against the `artists` array will not match.
      parameters:
        - name: slug
          in: path
          required: true
          description: URL-friendly artist slug (e.g., `radiohead`)
          schema:
            type: string
      responses:
        '200':
          description: List of concerts for the artist
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Concert'
  /cities/{slug}.json:
    get:
      summary: Retrieve Concerts by City
      description: |
        Returns the list of concerts in a specific city/geo-cluster, matching the city's URL-friendly slug.

        **Note (Static Hosting Limitation)**: Because this API is statically hosted on GitHub Pages, requests for non-existent city slugs cannot return a JSON 404 response and instead fall through to standard HTML 404 pages. `index.json`'s `cities` array holds raw display names, not slugs -- run each name through the same `slugify()` logic the publisher uses (lowercase, strip diacritics, hyphenate) to build the set of valid slugs, then check the requested slug against *that* set before making this query. Comparing the raw slug directly against the `cities` array will not match.
      parameters:
        - name: slug
          in: path
          required: true
          description: URL-friendly city slug (e.g., `berlin`)
          schema:
            type: string
      responses:
        '200':
          description: List of concerts in the city
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Concert'
components:
  schemas:
    PublishIndex:
      type: object
      required:
        - schemaVersion
        - lastRun
        - stats
        - artists
        - cities
      properties:
        schemaVersion:
          type: integer
          example: 1
        lastRun:
          type: string
          format: date-time
          example: '2026-07-08T03:00:00.000Z'
        stats:
          $ref: '#/components/schemas/PublishStats'
        artists:
          type: array
          description: Raw artist display names, not slugs.
          items:
            type: string
          example: ['Radiohead', 'The Smile']
        cities:
          type: array
          description: Raw city display names, not slugs.
          items:
            type: string
          example: ['Berlin', 'London']
    PublishStats:
      type: object
      required:
        - totalConcerts
        - uniqueArtists
        - uniqueCities
        - pageCount
        - pageSize
      properties:
        totalConcerts:
          type: integer
          minimum: 0
        uniqueArtists:
          type: integer
          minimum: 0
        uniqueCities:
          type: integer
          minimum: 0
        pageCount:
          type: integer
          minimum: 0
        pageSize:
          type: integer
          minimum: 1
    ArtistDiscovery:
      type: object
      description: >-
        Version 1 estimates accumulated Last.fm audience, not current popularity,
        regional recognition or music quality. Fixed thresholds: very-large >=
        1000000 listeners, large >= 100000, medium >= 10000, small > 0.
        Missing, zero or invalid metrics are unknown. No growth, peak-era or
        generation inference. Technical acquisition tiers are unrelated.
      required: [version, audience, basis, metricAsOf]
      properties:
        version:
          type: integer
          enum: [1]
        audience:
          type: string
          enum: [very-large, large, medium, small, unknown]
        basis:
          type: string
          enum: [lastfm-listeners]
        metricAsOf:
          type: string
          nullable: true
          enum: [null]
          description: Always null in version 1; the metric observation date is not known.
    ArtistCatalogEntry:
      type: object
      required:
        - slug
        - name
        - discovery
      properties:
        slug:
          type: string
          example: 'radiohead'
        name:
          type: string
          example: 'Radiohead'
        website:
          type: string
          format: uri
          nullable: true
        socials:
          type: object
          additionalProperties:
            type: string
          example:
            spotify: 'https://open.spotify.com/artist/4Z8W4fdv2fs2g504Z4gGSI'
            instagram: 'https://www.instagram.com/radiohead'
        spotifyId:
          type: string
          example: '4Z8W4fdv2fs2g504Z4gGSI'
        mbid:
          type: string
          format: uuid
          example: 'a74b1b7f-71a5-4011-9441-d0b5e4122d11'
        genres:
          type: array
          items:
            type: string
          example: ['alternative rock', 'art rock']
        popularity:
          type: object
          required:
            - listeners
            - playcount
          properties:
            listeners:
              type: integer
            playcount:
              type: integer
        discovery:
          $ref: '#/components/schemas/ArtistDiscovery'
        image:
          type: string
          format: uri
        similarArtists:
          type: array
          items:
            $ref: '#/components/schemas/SimilarArtistRef'
    SimilarArtistRef:
      type: object
      required:
        - name
        - slug
        - match
      properties:
        name:
          type: string
        slug:
          type: string
        match:
          type: number
          minimum: 0
          maximum: 1
    Concert:
      type: object
      required:
        - artist
        - date
        - venue
        - city
        - country
        - originalSource
        - scrapedAt
      properties:
        artist:
          type: string
          example: 'Radiohead'
        artistWebsite:
          type: string
          format: uri
          example: 'https://www.radiohead.com'
        artistDiscovery:
          $ref: '#/components/schemas/ArtistDiscovery'
        spotifyId:
          type: string
          example: '4Z8W4fdv2fs2g504Z4gGSI'
        mbid:
          type: string
          format: uuid
          example: 'a74b1b7f-71a5-4011-9441-d0b5e4122d11'
        artistSocials:
          type: object
          properties:
            spotify:
              type: string
              format: uri
              nullable: true
            instagram:
              type: string
              format: uri
              nullable: true
            facebook:
              type: string
              format: uri
              nullable: true
            youtube:
              type: string
              format: uri
              nullable: true
            telegram:
              type: string
              format: uri
              nullable: true
            vk:
              type: string
              format: uri
              nullable: true
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          example: '2026-10-15'
        venue:
          type: string
          example: 'Wembley Stadium'
        city:
          type: string
          example: 'London'
        country:
          type: string
          minLength: 2
          maxLength: 2
          example: 'GB'
        lat:
          type: number
          minimum: -90
          maximum: 90
          nullable: true
        lng:
          type: number
          minimum: -180
          maximum: 180
          nullable: true
        startTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: '20:00'
        venueKind:
          type: string
          enum: [stadium, arena, club, theatre, hall, open-air, other]
          example: 'stadium'
        festival:
          type: object
          required:
            - name
          properties:
            name:
              type: string
            url:
              type: string
              format: uri
        lineup:
          type: array
          items:
            type: string
          example: ['The Smile', 'Jonny Greenwood']
        priceRange:
          type: object
          required:
            - min
            - max
            - currency
          properties:
            min:
              type: number
              minimum: 0
            max:
              type: number
              minimum: 0
            currency:
              type: string
              example: 'GBP'
        ticketUrl:
          type: string
          format: uri
          description: >-
            The artist's own official website when known, NOT a ticket-vendor/
            aggregator purchase link -- those are frequently an unlabeled
            widget page or a generic city-listing URL with no indication of
            what it is. Falls back to the source's raw ticket/event link only
            when the artist has no known website.
        originalSource:
          type: string
          example: 'ticketmaster.co.uk'
        scrapedAt:
          type: string
          format: date-time
    Status:
      type: object
      description: >-
        Version 3 adds source verification and processing diagnostics. Existing
        flat counters and version 2 cohort reports remain available. Processing
        counters describe one pass, not a confirmed publication or deployment.
      required:
        - generatedAt
        - scrapersTotal
        - scrapersOk
        - scrapersFailed
        - venuesChanged
        - venuesUnchanged
        - failedVenueIds
        - staleVenues
        - ticketmasterEvents
        - publishedConcerts
        - conflictDropsLast7Days
      properties:
        schemaVersion:
          type: integer
          example: 3
        sourceHealth:
          type: object
          description: Reports keyed by venue, artist, bandsintown, eventbrite or ticketmaster. Missing reports mean unknown.
          additionalProperties:
            $ref: '#/components/schemas/SourceHealth'
        processing:
          type: object
          nullable: true
          description: Aggregate diagnostics only; representative rejected records stay in workflow artifacts.
          properties:
            schemaVersion:
              type: integer
              enum: [1]
            generatedAt:
              type: string
              format: date-time
            rawCount:
              type: integer
            publishedCount:
              type: integer
              description: Accepted by this processing pass; publication can still be blocked.
            duplicatesMerged:
              type: integer
            dropped:
              $ref: '#/components/schemas/ProcessingDropCounts'
            sources:
              type: object
              additionalProperties:
                type: object
                properties:
                  rawCount:
                    type: integer
                  publishedCount:
                    type: integer
                  duplicatesMerged:
                    type: integer
                  dropped:
                    $ref: '#/components/schemas/ProcessingDropCounts'
            validationIssues:
              type: object
              description: Counts by field path and validation code.
              additionalProperties:
                type: integer
            missingFields:
              type: object
              additionalProperties:
                type: integer
        generatedAt:
          type: string
          format: date-time
        scrapersTotal:
          type: integer
        scrapersOk:
          type: integer
        scrapersFailed:
          type: integer
        venuesChanged:
          type: integer
        venuesUnchanged:
          type: integer
        failedVenueIds:
          type: array
          items:
            type: string
        staleVenues:
          type: array
          items:
            type: string
        ticketmasterEvents:
          type: integer
        publishedConcerts:
          type: integer
          nullable: true
        conflictDropsLast7Days:
          type: integer
    ProcessingDropCounts:
      type: object
      properties:
        incomplete:
          type: integer
        notApproved:
          type: integer
        badDate:
          type: integer
        pastDate:
          type: integer
        zodFail:
          type: integer
    SourceHealth:
      type: object
      properties:
        schemaVersion:
          type: integer
          enum: [1]
        generatedAt:
          type: string
          format: date-time
        source:
          type: string
          enum: [venue, artist, bandsintown, eventbrite, ticketmaster]
        state:
          type: string
          enum: [healthy, degraded, unavailable, unknown, not_run]
        completeness:
          type: string
          enum: [complete, partial, unknown]
        counts:
          type: object
          description: >-
            Target counts (countries for Ticketmaster, artists or scraper configs
            otherwise), not HTTP request counts. Includes targets, selected,
            attempted, succeeded, failed, empty, unavailable, skippedFresh,
            missing (no cache), cacheFallbacks and partial.
          additionalProperties:
            type: integer
            minimum: 0
        freshness:
          type: object
          description: >-
            Ages at report generation, based only on explicit successful
            verification (verifiedAt). Legacy timestamps do not imply verification.
            Revisit intervals govern request cadence, not a stale-data SLA.
          properties:
            basis:
              type: string
              enum: [verifiedAt]
            classification:
              type: string
              enum: [revisit_interval, current_run]
            revisitIntervalDays:
              type: number
            intervalMeaning:
              type: string
              enum: [minimum_revisit_interval_not_stale_sla]
            fresh:
              type: integer
            old:
              type: integer
            unknown:
              type: integer
            latestVerifiedAt:
              type: string
              format: date-time
              nullable: true
            p50Days:
              type: number
              nullable: true
            p95Days:
              type: number
              nullable: true
            maxDays:
              type: number
              nullable: true
        halted:
          type: object
          properties:
            category:
              type: string
            count:
              type: integer
        issues:
          type: array
          items:
            type: object
            properties:
              reason:
                type: string
              count:
                type: integer
              action:
                type: string
    ChangeEntry:
      type: object
      required:
        - concertId
        - artist
        - date
        - venue
        - city
        - country
        - detectedAt
      properties:
        artistDiscovery:
          $ref: '#/components/schemas/ArtistDiscovery'
        concertId:
          type: string
        artist:
          type: string
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        venue:
          type: string
        city:
          type: string
        country:
          type: string
          minLength: 2
          maxLength: 2
        detectedAt:
          type: string
          format: date-time
