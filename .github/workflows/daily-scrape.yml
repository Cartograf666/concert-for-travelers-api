name: Daily Concert Scrape

# The workflow_run event that daily-scrape-retry.yml listens on does NOT expose
# this run's own workflow_dispatch inputs (GitHub's runs API has no `.inputs`
# field) -- run-name is the one thing that DOES survive into that event's
# `display_title`, so it's how the retry workflow tells a fresh manual dispatch
# apart from one it already auto-retried, without needing any external state.
run-name: ${{ (github.event.inputs.is_retry == 'true') && 'Daily Concert Scrape (auto-retry)' || 'Daily Concert Scrape' }}

on:
  workflow_run:
    workflows: ["Artist Tour-Page Scrape"]
    types: [completed]
  workflow_dispatch: # Allow manual trigger
    inputs:
      is_retry:
        description: "internal: set by the auto-retry workflow, don't set manually"
        required: false
        default: 'false'
        type: string

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write # open/update a dedup'd failure issue (see "Alert on failure" step)

jobs:
  # Own concurrency group (shared with enrich-auto.yml/enrich-database.yml) because
  # this job's own "Commit and Push Enriched Artist Metadata" step below writes the
  # same data/artists/ (sharded artist DB) those workflows do. Previously this whole
  # workflow only had the 'pages' group, so a same-file write here could run fully
  # in parallel with an enrich-* run -- both racing to push, repeatedly hitting an
  # unresolvable rebase conflict and dropping real enrichment work (observed live:
  # 3 consecutive enrich-auto sub-chunks lost to this race in one run). Splitting
  # deploy into its own job below is what lets this one join artist-db-write without
  # losing the pages-specific cancel-in-progress behavior.
  scrape:
    # Failed artist runs still publish venues with last-good artist data. Never
    # consume a fork/non-default-branch producer in this privileged workflow.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.repository.full_name == github.repository &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    concurrency:
      group: artist-db-write
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # A wedged run must not sit on the 6h Actions default ceiling. Raised 30 -> 60
    # on 2026-07-28: bulk Wikidata alias enrichment landed 110k aliases in the
    # artist DB on 07-24, which nearly tripled the whitelist-matcher's per-event
    # substring scan (58k -> 153k candidate entries). Matching runs twice per run
    # (pre- and post-enrichment pass), so the job went 279s+346s -> ~1110s+1110s and
    # blew the 30m ceiling every day from 07-25 on, cancelling four consecutive
    # deploys. 60m restores headroom; the matcher indexing work is the real fix.
    timeout-minutes: 60
    outputs:
      should_deploy: ${{ steps.health-check.outputs.should_deploy }}
      pages_ready: ${{ steps.prepare-pages.outputs.ready }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Only pay Chromium's download/install cost on days a 'playwright_render'
      # scraper actually exists -- most venues are plain HTTP fetches.
      - name: Check for playwright_render scrapers
        id: check-playwright
        run: |
          if grep -l '"type"[[:space:]]*:[[:space:]]*"playwright_render"' scrapers/*.json > /dev/null 2>&1; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright browser (chromium)
        if: steps.check-playwright.outputs.needed == 'true'
        run: npx playwright install --with-deps chromium

      - name: Build project
        run: npm run build

      # Persist the per-venue change-detection cache across daily runs. Without it
      # the fresh checkout starts empty, every venue always looks "changed", and the
      # scraper's short-circuit never fires in CI.
      - name: Restore scrape cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/scrape-cache.json
          key: scrape-cache-${{ github.run_id }}
          restore-keys: |
            scrape-cache-

      # Which concerts were already known as of the last run, so dist/changes.json
      # only reports genuinely new ones. Not git-tracked -- same cache mechanism as
      # the scrape cache above, so it doesn't add another writer to the repo.
      - name: Restore changelog cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/changelog-cache.json
          key: changelog-cache-${{ github.run_id }}
          restore-keys: |
            changelog-cache-

      # Read-only here; the serialized geocode backfill is the sole cache writer.
      - name: Restore geocode cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/geocode-cache.json
          key: geocode-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            geocode-v1-

      # Per-country last-successful Ticketmaster results, so a transient failure on
      # one country falls back to yesterday's data instead of contributing nothing.
      - name: Restore Ticketmaster cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/ticketmaster-cache.json
          key: ticketmaster-cache-${{ github.run_id }}
          restore-keys: |
            ticketmaster-cache-

      # Baseline of the last successfully-deployed publish stats, so the health
      # gate below has something to compare a fresh totalConcerts against.
      - name: Restore last-good publish stats
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/last-good-stats.json
          key: publish-stats-${{ github.run_id }}
          restore-keys: |
            publish-stats-

      # Full last-good Pages payload. On a blocked/no-op run we deploy only the
      # new status over this snapshot, so health remains current without ever
      # replacing the API with data that failed the publication gate.
      - name: Restore last-good Pages payload
        id: restore-site-bundle
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            reports/last-good-site
            reports/geocode-cache-backup.json
          key: publish-site-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            publish-site-v2-

      # Separate restore is necessary: Actions cache versions include path lists.
      - name: Restore legacy Pages snapshot during migration
        if: steps.restore-site-bundle.outputs.cache-matched-key == ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/last-good-site
          key: publish-site-${{ github.run_id }}
          restore-keys: |
            publish-site-

      # Read-only: owned and saved by artist-scrape.yml (its own, less-frequent
      # workflow -- see there for why). This job only merges in whatever it last
      # produced, never scrapes scrapers/artists/ itself, so it never saves this key.
      - name: Restore artist scrape cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/artist-scrape-cache.json
          key: artist-scrape-cache-${{ github.run_id }}
          restore-keys: |
            artist-scrape-cache-

      # Read-only output of artist-scrape.yml. This lets run.ts carry the most
      # recent artist cohort health into the next published status.json without
      # making the daily venue workflow responsible for artist scraping.
      - name: Restore artist run manifest
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/artist-run-manifest.json
          key: artist-run-manifest-${{ github.run_id }}
          restore-keys: |
            artist-run-manifest-

      # Read-only, same as the artist tour-page cache above: owned by
      # artist-scrape.yml's Bandsintown sweep, merged into today's publish here.
      - name: Restore Bandsintown cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/bandsintown-cache.json
          key: bandsintown-cache-${{ github.run_id }}
          restore-keys: |
            bandsintown-cache-

      # Read-only, same as the two caches above: owned by artist-scrape.yml's
      # Eventbrite sweep, merged into today's publish here.
      - name: Restore Eventbrite cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/eventbrite-cache.json
          key: eventbrite-cache-${{ github.run_id }}
          restore-keys: |
            eventbrite-cache-

      # Sync the whitelist from the user's target list first: a name added to
      # data/artist_scrape_targets.txt must be in the approved-artist DB (data/artists/)
      # or its scraped/Bandsintown shows get dropped as "not approved". Idempotent (adds
      # only what's missing); the diff is committed by the enrich step below, so
      # editing the target list is all that's needed to cover a new artist.
      - name: Sync target artists into whitelist
        run: |
          rm -rf /tmp/artists-before
          cp -R data/artists /tmp/artists-before
          npm run add-targets

      - name: Run Scraper
        env:
          # Full multi-key rotation, same set every other Gemini-calling workflow
          # wires -- the new LLM-extraction fallback in runner.ts (src/engine/
          # llm_extraction_fallback.ts) runs during this exact step, on top of
          # whatever add-targets already used above, so it shares the same quota
          # pool and benefits from the same failover.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_RESERV1: ${{ secrets.GEMINI_API_KEY_RESERV1 }}
          GEMINI_API_KEY_RESERV2: ${{ secrets.GEMINI_API_KEY_RESERV2 }}
          GEMINI_API_KEY_RESERV3: ${{ secrets.GEMINI_API_KEY_RESERV3 }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: |
          npm run scrape
          rm -rf /tmp/artists-after
          cp -R data/artists /tmp/artists-after

      - name: Save scrape cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/scrape-cache.json
          key: scrape-cache-${{ github.run_id }}

      - name: Save changelog cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/changelog-cache.json
          key: changelog-cache-${{ github.run_id }}

      - name: Save Ticketmaster cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/ticketmaster-cache.json
          key: ticketmaster-cache-${{ github.run_id }}

      # Gate the deploy: publishConcerts has no built-in floor on how few concerts
      # it's willing to publish, so a scraper regression or mass venue failure could
      # otherwise ship a near-empty/empty dataset straight to production. A no-op day
      # (nothing changed, run.ts's short-circuit means dist/ was never written) is
      # NOT a failure -- it just means there's nothing new to deploy.
      - name: Check publish health
        id: health-check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            core.setOutput('should_deploy', 'false');
            core.setOutput('should_publish_status', 'false');
            // status.json is published with Pages. Record the gate decision in
            // the same versioned surface instead of leaving a green-looking
            // scrape status whose deployment was actually refused.
            const recordGate = (state, reason) => {
              if (!fs.existsSync('dist/status.json')) return;
              const status = JSON.parse(fs.readFileSync('dist/status.json', 'utf-8'));
              status.publication = {
                ...(status.publication || { schemaVersion: 1 }),
                healthGate: {
                  state,
                  reason,
                  evaluatedAt: new Date().toISOString()
                }
              };
              fs.writeFileSync('dist/status.json', JSON.stringify(status, null, 2));
              core.setOutput('should_publish_status', 'true');
            };
            if (!fs.existsSync('dist/index.json')) {
              console.log('No dist/index.json -- scrape run was a no-op (nothing changed since last deploy). Skipping deploy.');
              recordGate('not_required', 'No publish was needed because the source data did not change.');
              core.setOutput('should_deploy', 'false');
              return;
            }

            const index = JSON.parse(fs.readFileSync('dist/index.json', 'utf-8'));
            const total = index.stats.totalConcerts;
            console.log(`Freshly published totalConcerts: ${total}`);

            if (total === 0) {
              recordGate('blocked', 'totalConcerts is 0');
              core.setFailed('Health gate: totalConcerts is 0 -- refusing to deploy an empty dataset.');
              return;
            }

            // publishConcerts no longer aborts when a handful of per-slug files
            // cannot be written -- one unwritable filename used to abort the
            // entire publish, which is what kept the API frozen for 23 days.
            // It reports them here instead, so deciding whether that degree of
            // incompleteness may ship is this gate's call, not the publisher's.
            // A failed scraper does not reduce totalConcerts: run.ts deliberately
            // reuses that venue's cached events so a transient outage cannot wipe
            // its dates. Correct -- but it also means the floor and the -50% guard
            // below CANNOT see mass scraper failure: every scraper could break and
            // totalConcerts would hold steady on stale cache. run.ts already
            // records the real numbers in dist/status.json; nothing read them.
            if (fs.existsSync('dist/status.json')) {
              const status = JSON.parse(fs.readFileSync('dist/status.json', 'utf-8'));
              const total = status.scrapersTotal || 0;
              const ok = status.scrapersOk || 0;
              if (total > 0) {
                const okRate = ok / total;
                console.log(`Scraper success: ${ok}/${total} (${(okRate * 100).toFixed(0)}%)`);
                // Roughly a third of scrapers fail on a normal day (dead venues,
                // 403s, layout drift), so this floor is far below the baseline and
                // only trips on something systemic -- a network/DNS failure, an
                // expired credential, a bad deploy of the runner itself.
                if (okRate < 0.25) {
                  recordGate('blocked', `Only ${ok}/${total} venue scrapers succeeded.`);
                  core.setFailed(
                    `Health gate: only ${ok}/${total} scrapers succeeded (${(okRate * 100).toFixed(0)}%) -- ` +
                    `the published set would be almost entirely stale cache. Refusing to deploy.`
                  );
                  return;
                }
                if (Array.isArray(status.staleVenues) && status.staleVenues.length > 0) {
                  core.warning(`${status.staleVenues.length} venue(s) are being served from a cache past the staleness bound.`);
                }
              }
            }

            const failedWrites = index.stats.failedWrites || 0;
            if (failedWrites > 0) {
              const share = failedWrites / total;
              core.warning(`Publish tolerated ${failedWrites} failed per-slug write(s).`);
              if (share > 0.01) {
                recordGate('blocked', `${failedWrites} per-slug publish writes failed.`);
                core.setFailed(
                  `Health gate: ${failedWrites} per-slug writes failed ` +
                  `(${(share * 100).toFixed(2)}% of ${total} concerts) -- refusing to deploy a visibly incomplete dataset.`
                );
                return;
              }
            }

            let baseline = null;
            if (fs.existsSync('reports/last-good-stats.json')) {
              baseline = JSON.parse(fs.readFileSync('reports/last-good-stats.json', 'utf-8'));
            }
            if (baseline && total < baseline.totalConcerts * 0.5) {
              recordGate('blocked', `totalConcerts dropped from ${baseline.totalConcerts} to ${total}.`);
              core.setFailed(
                `Health gate: totalConcerts dropped from ${baseline.totalConcerts} to ${total} ` +
                `(more than 50%) -- refusing to deploy. Investigate before overriding.`
              );
              return;
            }

            fs.mkdirSync('reports', { recursive: true });
            fs.writeFileSync('reports/last-good-stats.json', JSON.stringify(index.stats, null, 2));
            recordGate('eligible', 'Current publication passed the existing health gate.');
            core.setOutput('should_deploy', 'true');

      - name: Save last-good publish stats
        if: steps.health-check.outputs.should_deploy == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/last-good-stats.json
          key: publish-stats-${{ github.run_id }}

      - name: Snapshot last-good Pages payload
        if: steps.health-check.outputs.should_deploy == 'true'
        run: |
          rm -rf reports/last-good-site
          mkdir -p reports/last-good-site
          cp -R dist/. reports/last-good-site/

      - name: Save last-good Pages payload
        if: steps.health-check.outputs.should_deploy == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            reports/last-good-site
            reports/geocode-cache-backup.json
          key: publish-site-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit and Push Enriched Artist Metadata
        run: |
          if git diff --quiet -- data/artists/; then
            echo "No new artist metadata enriched."
          else
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add data/artists/
            git commit -m "auto: enrich artist websites and socials [skip ci]"

            # main is written to concurrently (self-heal auto-merges, the enrich-*
            # workflows, manual pushes) -- a bare push races and fails on any
            # concurrent write. Retry with rebase a few times before giving up;
            # this data is supplementary enrichment data (and sharded, so two
            # writers only actually conflict if they touched the same shard file),
            # so on an unresolvable conflict, drop this run's commit rather than
            # fail the whole job -- the next scheduled enrichment pass redoes it.
            pushed=false
            for i in 1 2 3 4 5; do
              if git push; then
                pushed=true
                break
              fi
              echo "Push rejected (concurrent write), retrying with rebase ($i/5)..."
              git fetch origin main
              if ! git rebase origin/main; then
                echo "::warning::Rebase conflict on data/artists/ -- replaying this run's enrichment on fresh origin/main."
                git rebase --abort
                git fetch origin main
                git reset --hard origin/main
                npm run reapply-artist-db-delta -- /tmp/artists-before /tmp/artists-after
                if git diff --quiet -- data/artists/; then
                  echo "::warning::Replay produced no data/artists changes; nothing to push."
                else
                  git add data/artists/
                  git commit -m "auto: enrich artist websites and socials (reapplied) [skip ci]"
                  if git push; then pushed=true; else npm run record-conflict-drop -- daily-scrape || true; fi
                fi
                break
              fi
              sleep $((RANDOM % 5 + 2))
            done

            if [ "$pushed" = "true" ]; then
              echo "Successfully committed and pushed enriched artist metadata."
            else
              echo "::warning::Could not push enriched artist metadata after retries -- skipped for this run."
            fi
          fi

      # if: always() -- without it, this step (like every step below with no
      # override) implicitly requires success(), so it gets skipped exactly when
      # the health-check gate fails (0 concerts or a >50% drop). fail-log.json is
      # already written to reports/ well before that gate runs, but self-heal.yml
      # (triggered by this workflow completing) downloads this exact artifact --
      # skipping the upload here meant self-heal silently treated "no artifact" as
      # "nothing to heal" on precisely the runs where scraper breakage was worst.
      - name: Upload fail log report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scraper-reports
          path: reports/
          retention-days: 5

      - name: Prepare safe Pages payload
        id: prepare-pages
        if: always()
        run: |
          echo "ready=false" >> "$GITHUB_OUTPUT"
          mkdir -p pages-dist
          if [ "${{ steps.health-check.outputs.should_deploy }}" = "true" ]; then
            cp -R dist/. pages-dist/
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.health-check.outputs.should_publish_status }}" = "true" ] && \
               [ -f dist/status.json ] && [ -f reports/last-good-site/index.json ]; then
            cp -R reports/last-good-site/. pages-dist/
            cp dist/status.json pages-dist/status.json
            cp public/dashboard.html pages-dist/index.html
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Publishing current health over the last-good API payload."
          else
            echo "::warning::No safe last-good Pages snapshot is available; leaving the deployed API/status untouched."
          fi

      - name: Setup Pages
        if: always() && steps.prepare-pages.outputs.ready == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        if: always() && steps.prepare-pages.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './pages-dist'

      # Turn a silent scheduled-run failure into a visible, deduplicated GitHub issue
      # (GitHub only emails the workflow author, and mutes that after repeated failures).
      - name: Alert on failure
        if: failure()
        uses: ./.github/actions/alert-on-failure
        with:
          workflow-name: Daily concert scrape
          job-label: scrape

  # Separate job (not just a step) so its 'pages' concurrency lock -- which cancels
  # a stale in-progress deploy the moment a newer one starts -- only ever applies to
  # the actual Pages deployment, never to the scrape/enrich job above (which needs
  # to queue, not cancel, against enrich-auto/enrich-database instead; see the
  # comment on the `scrape` job). `actions/deploy-pages` picks up the artifact
  # `actions/upload-pages-artifact` uploaded in the `scrape` job automatically --
  # no explicit download step needed since both jobs belong to the same workflow run.
  deploy:
    needs: scrape
    if: always() && needs.scrape.outputs.pages_ready == 'true'
    concurrency:
      group: pages
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Narrower than the workflow-level permissions block: this job never pushes
    # to the repo (that's the scrape job's git push), so no contents: write here.
    permissions:
      pages: write
      id-token: write
      issues: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Needed to resolve the local ./.github/actions/alert-on-failure composite
      # action below -- deploy-pages itself doesn't need a checkout.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      - name: Alert on failure
        if: failure()
        uses: ./.github/actions/alert-on-failure
        with:
          workflow-name: Daily concert scrape
          job-label: deploy
