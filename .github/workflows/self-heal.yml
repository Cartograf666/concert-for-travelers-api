name: Self-Healing Pipeline

on:
  workflow_run:
    workflows: ["Daily Concert Scrape"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  issues: write # open/update a dedup'd failure issue (see "Alert on failure" step)

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # a wedged Playwright install/Gemini repair call/test run must not sit on the 6h Actions default ceiling
    # Run only if the triggering workflow succeeded or completed, and we have failures to check
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download fail log from triggering run
        id: download-reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reports
          # Use GitHub CLI to download the artifact from the triggering run. A real
          # API/auth failure must be distinguishable from "no artifact exists yet"
          # (e.g. the triggering run never got to the upload step) -- only the latter
          # is a legitimate "nothing to heal" case.
          if gh run download ${{ github.event.workflow_run.id }} --name scraper-reports --dir reports 2> download-error.log; then
            echo "downloaded=true" >> "$GITHUB_OUTPUT"
          else
            if grep -qi "no valid artifacts found" download-error.log; then
              echo "No reports artifact found on the triggering run -- nothing to heal."
              echo "downloaded=false" >> "$GITHUB_OUTPUT"
            else
              echo "::error::gh run download failed for a reason other than a missing artifact:"
              cat download-error.log
              exit 1
            fi
          fi

      - name: Check if there are failures
        id: check-failures
        run: |
          if [ -f reports/fail-log.json ] && [ "$(jq '. | length' reports/fail-log.json)" -gt 0 ]; then
            echo "has_failures=true" >> "$GITHUB_OUTPUT"
            echo "Found failed scrapers. Proceeding with self-healing."
          else
            echo "has_failures=false" >> "$GITHUB_OUTPUT"
            echo "No failed scrapers found. Nothing to heal."
          fi

      - name: Setup Node.js
        if: steps.check-failures.outputs.has_failures == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        if: steps.check-failures.outputs.has_failures == 'true'
        run: npm ci

      # tests/runner.test.ts unconditionally exercises the playwright_render code
      # path (unlike daily-scrape.yml, this can't be gated on whether a
      # playwright_render scraper currently exists) -- without chromium installed,
      # "Verify Fixed Configs" below hangs/fails on that test.
      - name: Install Playwright browser (chromium)
        if: steps.check-failures.outputs.has_failures == 'true'
        run: npx playwright install --with-deps chromium

      # The healer classifies each failure and picks a strategy: dead domain, moved
      # URL, anti-bot block, transient error, client-side rendering, or stale
      # selectors. Only the last one calls Gemini -- the rest are deterministic --
      # so the full key set is wired the same way the daily scrape does it.
      #
      # Every candidate fix, LLM or not, must pass healing/verify.ts against the LIVE
      # page before it is written: >=1 event, dates that parse with at least one in
      # the future, artist values that aren't page chrome, absolute ticket URLs, and
      # no collapse in event count versus the last good run.
      - name: Run Healer Script
        if: steps.check-failures.outputs.has_failures == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_RESERV1: ${{ secrets.GEMINI_API_KEY_RESERV1 }}
          GEMINI_API_KEY_RESERV2: ${{ secrets.GEMINI_API_KEY_RESERV2 }}
          GEMINI_API_KEY_RESERV3: ${{ secrets.GEMINI_API_KEY_RESERV3 }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          # Stop probing 15min before this job's timeout-minutes so a heavy failure
          # day ends with a clean report instead of being force-killed mid-write.
          HEAL_BUDGET_MS: '2700000'
        run: npm run heal

      # Repo-wide regression check. NOT the acceptance gate for the repairs -- this
      # suite passes identically whether the new selectors are correct or point at
      # the cookie banner, which is exactly why it used to let bad repairs through.
      # The per-scraper gate ran inside `npm run heal` above; this only catches a
      # healer change that broke something else in the codebase.
      - name: Run repo test suite
        if: steps.check-failures.outputs.has_failures == 'true'
        run: npm run test

      - name: Upload repair report
        if: always() && steps.check-failures.outputs.has_failures == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: repair-report
          path: reports/repair-report.json
          retention-days: 14

      - name: Check for repaired scrapers
        if: steps.check-failures.outputs.has_failures == 'true'
        id: check-repaired
        run: |
          if [ -f reports/repair-summary.json ]; then
            echo "repaired=true" >> "$GITHUB_OUTPUT"
          else
            echo "repaired=false" >> "$GITHUB_OUTPUT"
            echo "No scraper configs were successfully repaired."
          fi

      # Open a PR (audit trail + diff visibility) and squash-merge it automatically.
      # Every config in this diff already passed the live verification gate, so
      # holding it for manual review would be the only non-autonomous step in the
      # pipeline. data/repair-history.json ships with it: it carries the pre-repair
      # config for each change, which is what lets confirm_repairs.ts roll a repair
      # back on its own if it stops working over the next runs.
      - name: Open PR with repaired scrapers
        id: cpr
        if: steps.check-failures.outputs.has_failures == 'true' && steps.check-repaired.outputs.repaired == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          commit-message: "auto: self-healed broken scrapers"
          branch: auto/self-heal-${{ github.event.workflow_run.id }}
          delete-branch: true
          title: "Self-heal: repair broken scrapers"
          body: |
            Automated repair from the failed [Daily Concert Scrape run](${{ github.event.workflow_run.html_url }}).

            Each changed config was re-fetched **live** and had to pass every check in
            `src/healing/verify.ts` before it was written:

            - at least one event extracted
            - >=60% of date strings parse, and at least one date is today or later
            - <=20% of artist values look like page chrome ("Tickets", "Read more", the venue name)
            - >=80% of ticket URLs are absolute http(s)
            - event count did not collapse below 30% of the last good run

            Per-scraper strategy, verification output and every rejected candidate are in
            the `repair-report` artifact on the triggering run.

            If a repair stops working, `confirm_repairs.ts` restores the previous config
            automatically after two consecutive post-repair failures -- no manual revert
            needed.
          add-paths: |
            scrapers/
            data/repair-history.json

      - name: Auto-merge repaired-scraper PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --squash --delete-branch "${{ steps.cpr.outputs.pull-request-number }}"

      # A failing healer is itself a silent failure mode — surface it the same way
      # the daily scrape does (deduplicated GitHub issue) instead of it dying quietly.
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TITLE="🚨 Self-heal pipeline failed"
          num=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "Failed again on $(date -u '+%Y-%m-%d %H:%M UTC') — $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "The self-heal workflow failed. Logs: $RUN_URL"
          fi
