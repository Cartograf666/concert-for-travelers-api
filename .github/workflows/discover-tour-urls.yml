name: Discover Tour URLs

# Automates probing un-probed website-having artists for tour-page URLs (/tour, /shows, etc.)
# Runs on a schedule, saving hits to data/artists/ and data/tour-url-probe-hits.json.

on:
  schedule:
    # Daily, not weekly: the probe queue is ~11.6k artists and a weekly 300-run
    # would take eight months to reach the ones that actually play concerts.
    - cron: '0 4 * * *' # daily at 04:00 UTC
  workflow_dispatch:
    inputs:
      artists_count:
        description: 'Number of artists to probe this run'
        required: true
        default: '300'

permissions:
  contents: write
  issues: write # open/update a dedup'd failure issue (see "Alert on failure" step)

concurrency:
  group: artist-db-write
  queue: max # retain up to 100 pending writers instead of replacing their slots
  cancel-in-progress: false

jobs:
  discover-tour-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # 800 artists at the measured ~3.4s each is ~45min; headroom for slow hosts
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A queued event SHA may predate the preceding writer's durable state.
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore discovery journal and snapshot baseline
        id: prepare
        env:
          ARTISTS_COUNT_INPUT: ${{ github.event.inputs.artists_count }}
        run: |
          set -eo pipefail
          COUNT=${ARTISTS_COUNT_INPUT:-800}
          npx tsx src/scripts/tourUrlDiscoveryRunner.ts restore "$COUNT"
          rm -rf /tmp/artists-before /tmp/artists-after /tmp/tour-url-audit-before.json /tmp/tour-url-audit-after.json
          cp -R data/artists /tmp/artists-before
          cp data/tour-url-probe-hits.json /tmp/tour-url-audit-before.json
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Run Tour URL discovery
        env:
          COUNT: ${{ steps.prepare.outputs.count }}
        run: |
          set -eo pipefail
          npm run discover-tour-urls -- run "$COUNT" 2>&1 | tee /tmp/discover-tour-urls.log

      # Ordinary probe/DB errors still export the valid partial journal, including
      # pending intents. Cancellation is best effort; hard kill/runner loss before
      # a confirmed push can only resume the preceding durable Git snapshot.
      - name: Export partial discovery state and snapshot results
        id: export
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        env:
          COUNT: ${{ steps.prepare.outputs.count }}
        run: |
          set -eo pipefail
          npx tsx src/scripts/tourUrlDiscoveryRunner.ts export "$COUNT"
          cp -R data/artists /tmp/artists-after
          cp data/tour-url-probe-hits.json /tmp/tour-url-audit-after.json
          cp -R data/tour-url-discovery-state /tmp/tour-url-discovery-state-after

      - name: Commit and push Tour URL discovery results
        if: ${{ always() && steps.prepare.outcome == 'success' && steps.export.outcome == 'success' }}
        uses: ./.github/actions/commit-artist-db-delta
        with:
          before-artists-dir: /tmp/artists-before
          after-artists-dir: /tmp/artists-after
          audit-before-file: /tmp/tour-url-audit-before.json
          audit-after-file: /tmp/tour-url-audit-after.json
          extra-path: data/tour-url-discovery-state
          extra-after-dir: /tmp/tour-url-discovery-state-after
          commit-message: "auto: discover tour URLs [skip ci]"

      - name: Alert on failure
        if: failure()
        uses: ./.github/actions/alert-on-failure
        with:
          workflow-name: "Discover Tour URLs"
          job-label: discover-tour-urls
