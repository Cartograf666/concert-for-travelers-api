name: Lint Workflows

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5 # a wedged run must not sit on the 6h Actions default ceiling
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run actionlint
        # Uses the maintained kjanat/actionlint 1.17.0 fork with concurrency.queue support.
        uses: reviewdog/action-actionlint@23bcc6aa6e2ccffe1e7730111b98ddcaf34cb098 # v1.76.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-check
          filter_mode: nofilter
          fail_level: any
