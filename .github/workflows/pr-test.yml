name: PR Verification

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scrapers/**'
      - 'data/**'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'tsconfig.json'

permissions:
  contents: read
  pull-requests: read # the integrity gate below asks which files this PR touched

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # a wedged run must not sit on the 6h Actions default ceiling
    # self-heal.yml already runs this exact test suite itself (npm ci + playwright
    # install + npm test) to gate whether a repaired scraper config is good, then
    # squash-merges the PR immediately without waiting on this workflow -- so this
    # run has zero gating value on that branch and just pays for a second full
    # chromium install + test run on every auto-merge. Skip it there.
    # Also requires the branch to live in THIS repo: head_ref is attacker-chosen
    # on a fork, so a fork PR could name its branch auto/self-heal-x and skip
    # verification entirely. self-heal's own branches are always same-repo.
    if: >-
      ${{ !(startsWith(github.head_ref, 'auto/self-heal-')
            && github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # tests/runner.test.ts unconditionally exercises the playwright_render code
      # path -- without chromium installed, "Run Tests" below hangs/fails on it.
      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Build project
        run: npm run build

      # `continue-on-error: true` meant this could never block anything, so a lint
      # error could land on main unnoticed. The config currently reports 0 errors
      # and 109 warnings, and eslint exits non-zero only on errors -- so enforcing
      # it costs nothing today and catches the first real one.
      - name: Lint code
        run: npm run lint

      - name: Run Tests
        run: npm run test

      # Offline data-quality ratchet over data/artists/. Pure JSON rules -- no
      # network, no LLM -- so it is safe to block a merge on. It fails only when
      # the ERROR count rises above data/artist-integrity-baseline.json, which
      # makes it a ratchet rather than a demand that 63k accumulated entries be
      # spotless. Lower the baseline as defects get cleaned:
      #   npm run audit-artist-integrity -- --update-baseline
      # The ratchet compares against data/artist-integrity-baseline.json, but the
      # enrichment bots write data/artists/ on main every few hours with
      # [skip ci], so main's true error count drifts upward between refreshes no
      # matter how often the baseline is re-anchored. Every PR then failed a
      # check for damage it had not done -- that is what blocked all six
      # dependabot PRs from 2026-08-12, and it recurred on this very PR
      # (baseline 121 recorded 2026-09-06 16:05, main already at 124 by the next
      # afternoon).
      #
      # A PR that does not touch data/artists/ cannot have added an artist-data
      # error, so running the gate on it measures only bot drift. Gate it on the
      # files the PR actually changed; drift itself is tracked by
      # integrity-baseline-refresh.yml, which alarms on a large daily jump.
      - name: Check whether this PR touches artist data
        id: artist-data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
               --paginate --jq '.[].filename' | grep -q '^data/artists/'; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
            echo "This PR changes data/artists/ -- enforcing the integrity ratchet."
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
            echo "This PR does not change data/artists/ -- skipping the ratchet (it would only measure bot drift on main)."
          fi

      - name: Artist data integrity
        if: steps.artist-data.outputs.touched == 'true'
        run: npm run audit-artist-integrity -- --strict

      # The duplicate city/venue selector defect -- one selector doing both jobs,
      # so every "city" is the whole event blurb -- is what froze the published
      # API for 24 days. The generator can no longer produce one, but nothing
      # stopped a hand-written or healed config from reintroducing it: the audit
      # script existed and was wired to nothing. A ratchet, not a demand that the
      # 132 pre-existing configs be fixed first.
      - name: Duplicate city/venue selectors (ratchet)
        run: |
          set -euo pipefail
          count=$(npm run --silent audit-city-selectors -- --json | jq '.offenders | length')
          baseline=$(cat .github/duplicate-city-selector-baseline.txt)
          echo "duplicate city/venue selector configs: $count (baseline $baseline)"
          if [ "$count" -gt "$baseline" ]; then
            echo "::error::Duplicate city/venue selector configs rose from $baseline to $count. A city selector that repeats the venue selector publishes the whole event block as the city."
            exit 1
          fi
          if [ "$count" -lt "$baseline" ]; then
            echo "::notice::Down to $count -- lower the baseline in .github/duplicate-city-selector-baseline.txt."
          fi
